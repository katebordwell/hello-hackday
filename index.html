<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, Hack Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bagel+Fat+One&family=VT323&display=swap">
<style>
:root{--desk:#2a8c86;--desk-dot:#237770;--win:#fff;--chrome:#cbc4ee;--ink:#1d1838;--sun:#ffd23f;--pink:#ff8fb1;--muted:#5a5478}
html,body{background:var(--desk)}
body{margin:0;background-image:radial-gradient(var(--desk-dot) 1.5px,transparent 1.6px);background-size:18px 18px;color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.5;padding:32px 16px 48px}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:28px}
.win{background:var(--win);border:3px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.bar{display:flex;align-items:center;gap:10px;background:var(--chrome);border-bottom:3px solid var(--ink);padding:4px 10px;font-family:"VT323",monospace;font-size:21px}
.bar>span:first-child{flex:1}
.btns{display:flex;gap:5px}.btns i{width:14px;height:14px;border:2.5px solid var(--ink);background:var(--win);border-radius:2px}.btns i:last-child{background:var(--pink)}
.inner{padding:24px 24px 28px}
h1{font-family:"Bagel Fat One","Arial Black",sans-serif;font-weight:400;font-size:clamp(48px,11vw,92px);line-height:.95;margin:0 0 12px}
h1 span{background:linear-gradient(transparent 58%,var(--sun) 58%,var(--sun) 88%,transparent 88%)}
p{margin:0;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a.site{display:flex;align-items:center;gap:14px;padding:14px 16px;border:3px solid var(--ink);border-radius:6px;background:#eef4ff;color:var(--ink);text-decoration:none;font-weight:700;font-size:19px;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
a.site:hover,a.site:focus-visible{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink);outline:none}
a.site small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
.ico{font-family:"VT323",monospace;font-size:28px;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <section class="win">
    <div class="bar"><span>hello_hackday.exe</span><span class="btns"><i></i><i></i><i></i></span></div>
    <div class="inner">
      <h1><span>hello,</span><br><span>hack day</span></h1>
      <p>Things I made with Claude. Pick one.</p>
    </div>
  </section>
  <section class="win">
    <div class="bar"><span>C:\SITES</span><span class="btns"><i></i><i></i><i></i></span></div>
    <div class="inner">
      <ul>
        <li><a class="site" href="cats/"><span class="ico">=^.^=</span><span>Hello, World of Cats<small>Thirty years of internet cats saying hello</small></span></a></li>
      </ul>
    </div>
  </section>
</div>
</body>
</html>
